<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var _th=localStorage.getItem('wzth')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=_th;document.documentElement.style.colorScheme=_th}catch(e){}</script>
<title>برنامج الوزير</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=Readex+Pro:wght@500;700&family=Almarai:wght@400;700&family=Cairo:wght@500;700&family=Changa:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@500;700&family=Kufam:wght@500;700&family=Lemonada:wght@500;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#143533;--mut:#6b8280;--pr:#0b8f7e;--pr2:#066a5f;--ln:#dce8e6;--gold:#f5b800;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--card:#162826;--tx:#e6f2f0;--mut:#8fb0ab;--ln:#244240}}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,sans-serif}
header{background:linear-gradient(135deg,var(--h1,#0a5c5a),var(--h2,#009688) 55%,var(--h3,#48a661));color:#fff;text-align:center;padding:28px 14px 22px;border-radius:0 0 34px 34px;box-shadow:0 10px 28px rgba(0,150,136,.25);position:relative}
header h1{margin:0;font-family:Amiri,serif;font-size:38px}header p{margin:6px 0 0;opacity:.92;font-size:14px;font-weight:700}
.modes{display:inline-flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px;margin-top:14px}
.modes button{border:0;background:none;color:#fff;padding:7px 20px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.modes button.on{background:#fff;color:var(--pr2);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
h2{margin:0 0 14px;font-size:19px;color:var(--pr2);text-align:center;font-family:Amiri,serif}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-bottom:2px}
.tabs button,.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;transition:.2s}
.tabs button.on,.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);max-width:100%}
input[type=number]{width:80px}
.btn{border:0;background:var(--pr);color:#fff;padding:8px 14px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{opacity:.92}
.btn.x{background:#d9534f;padding:6px 10px}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.btn.gold{background:linear-gradient(135deg,#e0a800,#b8860b);color:#fff;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.line:last-child{border:0}.mut{color:var(--mut);font-size:12px}
.cat{margin:14px 0 4px;font-weight:800;color:var(--pr)}
.sec{margin-top:16px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--pr) 10%,transparent);font-weight:800;color:var(--pr2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lock{max-width:340px;margin:30px auto;text-align:center}
.lock input{width:100%;text-align:center;font-size:22px;letter-spacing:8px;margin:12px 0}
.err{color:#d9534f;font-size:13px;min-height:18px}
.stairs{display:flex;align-items:flex-end;gap:4px;height:230px;direction:ltr;overflow-x:auto;border-bottom:4px solid var(--ln);padding-top:6px}
.stair{flex:1;min-width:62px;border-radius:10px 10px 0 0;padding:8px 2px;text-align:center;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;direction:rtl;color:#fff;box-shadow:inset 0 -14px 18px rgba(0,0,0,.08)}
.stair small{background:rgba(255,255,255,.92);color:#143533;border-radius:99px;padding:1px 6px;font-size:10px}
.stair em{font-style:normal;font-size:10px;opacity:.95}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border-radius:20px;padding:14px;text-align:center;border-top:4px solid var(--pr);box-shadow:0 4px 14px rgba(0,0,0,.04)}
.stat b{display:block;font-size:30px;color:var(--pr2)}.stat span{font-size:13px;color:var(--mut);font-weight:700}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.wk{border:1px solid var(--ln);border-radius:16px;padding:10px}.wk h3{margin:0 0 8px;font-size:13px;background:color-mix(in srgb,var(--pr) 12%,transparent);padding:6px 8px;border-radius:8px}
.wk div.i{background:var(--bg);border-right:3px solid var(--pr);margin-bottom:6px;padding:7px 8px;border-radius:9px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.empty{color:var(--mut);font-size:12px}.cn{color:var(--pr);font-weight:800}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:66px 0 30px;direction:ltr}
.pc{width:30%;max-width:165px;border-radius:22px;padding:0 8px 12px;text-align:center;background:var(--card);box-shadow:0 14px 28px rgba(0,0,0,.1);direction:rtl;animation:fl 4s ease-in-out infinite;position:relative}
.pc.p1{order:2;min-height:258px;border:4px solid #ffd700;background:linear-gradient(180deg,rgba(255,215,0,.16),var(--card))}
.pc.p2{order:1;min-height:215px;border:4px solid #c0c0c0}.pc.p3{order:3;min-height:192px;border:4px solid #cd7f32}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pi{width:64px;height:64px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:34px;margin:-34px auto 10px;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.p1 .pi{width:80px;height:80px;font-size:44px;margin-top:-44px;border:4px solid #ffd700}
.pn{font-weight:800;font-size:15px;color:var(--pr2)}.p1 .pn{font-size:17px}
.pc.tie:not(:has(.sn.on)) .px{display:none}
.pp{font-weight:800;font-size:22px;margin-top:6px}.pr{font-size:11px;font-weight:700;color:var(--pr);margin-top:4px}
.sn{cursor:pointer;user-select:none;display:inline-block;transition:.3s}
.sn .sd{display:inline-block;filter:blur(var(--snb,6px));opacity:var(--sno,.77);pointer-events:none;letter-spacing:1px}
.sn .sr{display:none}.sn.on .sr{display:inline}.sn.on .sd{display:none}
/* العجلة الدوارة */
.wh-fs{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:19px;cursor:pointer;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.wh-card.wh-big{position:fixed;inset:0;z-index:150;margin:0;border-radius:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border:0}
.wh-card.wh-big::before,.wh-card.wh-big::after{content:'';flex:none;margin:auto}
.wh-card.wh-big>*{flex:none}
.wh-card.wh-big .wh-fs{position:fixed}
.wh-card.wh-big .wh-stage{width:100%}
.wh-stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;direction:rtl;column-gap:14px}
.wh-stage .wh-wrap{margin:20px 0 6px}
.wh-side{display:flex;flex-direction:column;gap:.5em;min-width:0;overflow-y:auto;text-align:right;direction:rtl;font-size:16px;align-self:start;margin-top:22px}
.wh-side:empty{display:block}
.wh-side:not(:empty)::before,.wh-side:not(:empty)::after{content:'';flex:none;margin:auto}
.wh-side .wh-res{flex:none;height:5.4em;padding:0 .8em;gap:.4em;flex-wrap:nowrap;justify-content:center;border-radius:.9em;border-width:max(1px,.12em)}
.wh-side .wh-r1,.wh-side .wh-r2{gap:.55em;flex-wrap:nowrap;min-width:0}
.wh-side .wh-res b{font-size:1.2em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-side .wh-rk{font-size:.85em;padding:.25em .7em;border-radius:.6em;white-space:nowrap}
.wh-side .wh-res .mut{font-size:.75em;white-space:nowrap}
.wh-side .wh-res .bd{font-size:.7em;padding:.25em .8em;white-space:nowrap}
.wh-side .wh-res .det-btn{font-size:.7em;padding:.3em .6em;border-radius:.6em;white-space:nowrap}
.wh-side.wh-nar .wh-bl{display:none}
.wh-side.wh-nar .wh-res b{font-size:1.05em}
.wh-list.wh-fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.wh-card.wh-big .wh-list.wh-fin{width:min(1500px,94vw)}
.wh-card.wh-big .wh-wrap{width:min(68vh,92vw)}
.wh-card.wh-big .wh-list{width:min(640px,92vw)}
.wh-card{position:relative;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 14%,var(--card)),var(--card));border:2px solid var(--gold)}
.wh-st{font-size:18px;font-weight:800;color:var(--pr2);margin:2px 0 12px;min-height:28px}
.wh-wrap{position:relative;width:min(92vw,560px);margin:20px auto 6px;direction:ltr}
.wh-wrap canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.22))}
.wh-ptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:46px solid #e0a800;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));z-index:3}
.wh-btn{font-size:18px;padding:12px 30px;border-radius:14px}
.wh-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:right}
.wh-res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.06);animation:popIn .4s ease-out}
.wh-res b{font-size:20px;flex:1;min-width:120px;color:var(--pr2)}
.wh-res{flex-direction:column;align-items:stretch;gap:8px}
.wh-r1,.wh-r2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wh-res .bd{margin:0}
.wh-rk{background:linear-gradient(135deg,#e0a800,#b8860b);color:#fff;font-weight:800;border-radius:10px;padding:4px 12px;font-size:14px}
.chip.wchip{padding:11px 22px;font-size:15px}
.wbox{border:1.5px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.wbox.cur{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,var(--card))}
.wbox input[type=radio],.wbox input[type=checkbox]{width:18px;height:18px;accent-color:var(--pr)}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-bottom:6px}
.vip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.vc{background:linear-gradient(135deg,var(--h1,#0a5c5a),var(--h2,#009688));color:#fff;border:2px solid var(--gold);border-radius:16px;padding:14px;text-align:center;font-weight:800;position:relative}
.vc div:first-child{font-size:26px}
.lr{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:10px;border-radius:18px;border:1px solid var(--ln);border-right-width:8px;transition:.2s}
.lr:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.lr .pos{width:38px;height:38px;border-radius:11px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.06);flex:none}
.lr .inf{flex:1;min-width:0}.lr .nm{font-weight:800;font-size:16px;display:block}
.bd{display:inline-block;padding:3px 11px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;margin-top:4px}
.lr .pt{font-weight:800;font-size:20px;color:var(--pr2);display:flex;align-items:center;gap:6px}
.warn{background:#fff3cd;color:#664d03;border-radius:12px;padding:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13px}

/* إضافات التحسينات الجديدة */
.sync-pill{position:absolute;top:58px;right:12px;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:5px 11px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#a5d6a7}
.star-banner{background:linear-gradient(135deg,#fff8e1,#ffecb3);border:2px solid #ffd54f;color:#5d4037;border-radius:20px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 6px 18px rgba(245,184,0,.15)}
[data-theme=dark] .star-banner{background:linear-gradient(135deg,#3a2e0b,#292006);border-color:#8c6d1f;color:#ffe082}
.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;background:var(--card);padding:10px 14px;border-radius:16px;border:1px solid var(--ln);box-shadow:0 2px 10px rgba(0,0,0,.03)}
.search-bar input{border:0;background:transparent;flex:1;padding:4px;font-size:14px;outline:none}
.det-btn{border:1px solid var(--ln);background:var(--bg);color:var(--pr2);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:.2s}
.det-btn:hover{background:var(--pr);color:#fff;border-color:var(--pr)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:160;padding:14px;backdrop-filter:blur(3px)}
.modal-box{background:var(--card);color:var(--tx);border-radius:24px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;animation:popIn .2s ease-out}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.prog-wrap{background:var(--bg);border-radius:99px;height:12px;overflow:hidden;margin:8px 0;border:1px solid var(--ln)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pr),#48a661);border-radius:99px;transition:width .4s ease}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.mini-box{background:var(--bg);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--ln)}
.mini-box b{display:block;font-size:18px;color:var(--pr2);margin-top:2px}
.rec-switch{display:inline-flex;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}
.rec-switch button{border:0;background:none;color:var(--tx);padding:6px 14px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.rec-switch button.on{background:var(--pr);color:#fff;font-weight:700}
.bulk-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:var(--bg);border:1px solid var(--ln)}
.bulk-row.done{border-right:4px solid var(--pr);background:color-mix(in srgb,var(--pr) 8%,var(--bg))}
.confetti-piece{position:fixed;width:10px;height:14px;top:-20px;z-index:200;pointer-events:none; border-radius:2px;animation:cfall 2.2s linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}

:root[data-theme=dark]{--bg:#0e1b1a;--card:#162826;--tx:#e6f2f0;--mut:#8fb0ab;--ln:#244240;--pr:#27b3a0;--pr2:#6fe0d0}
[data-theme=dark] .modes button.on{color:#066a5f}[data-theme=dark] .warn{background:#4a3b0a;color:#ffe9a8}
.tg.fs{left:auto;right:12px;top:12px;z-index:6}
@media(max-width:560px){header{padding-top:84px}}
/* شريط الحالة في الآيباد والآيفون: الترويسة تمتد تحته بدل الشريط الأبيض */
header{padding-top:calc(28px + env(safe-area-inset-top,0px))}
header .tg{top:calc(12px + env(safe-area-inset-top,0px))}
header .sync-pill{margin-top:env(safe-area-inset-top,0px)}
@media(max-width:560px){header{padding-top:calc(84px + env(safe-area-inset-top,0px))}}
/* ملء الشاشة على الأجهزة اللمسية: زر الخروج (X) من النظام نفسه، فنخفي زرّنا حتى لا يتداخلا */
@media(pointer:coarse){:fullscreen #fsb,:-webkit-full-screen #fsb{display:none!important}}
/* ===== الآيباد والجوال بالعرض: خانات متساوية تملأ الأسطر ===== */
@media(min-width:601px) and (max-width:1100px){
 .tabs{gap:7px}
 .tabs>button{flex:1 1 calc(25% - 7px);min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis}
 .tabs:has(>.chip:nth-child(5))>button{flex-basis:calc(16.66% - 7px)}
 .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
/* ===== الجوال: أبعاد وحدود مرتبة ===== */
@media(max-width:600px){
 main{padding:10px 10px 16px}
 header{padding:calc(88px + env(safe-area-inset-top,0px)) 12px 18px;border-radius:0 0 26px 26px}
 header h1{font-size:31px}header p{font-size:13px;margin-top:4px}
 .modes{margin-top:12px}.modes button{padding:8px 22px}
 .card{padding:14px 12px;border-radius:18px;margin-bottom:12px}
 h2{font-size:18px;margin-bottom:12px}
 .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
 .tabs>button{flex:1 1 calc(50% - 6px);min-width:0;padding:10px 6px;font-size:12.5px;text-align:center;overflow:hidden;text-overflow:ellipsis}
 .tabs:has(>.chip:nth-child(5))>button{flex-basis:calc(33.33% - 6px);padding:9px 4px;font-size:12px}
 .stats{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
 .stat{padding:10px 4px;border-radius:16px;border-top-width:3px}
 .stat b{font-size:22px}.stat span{font-size:11px;line-height:1.35;display:block}
 .stairs{gap:3px;height:205px;overflow-x:visible}
 .stair{min-width:0;padding:6px 1px;font-size:9.5px;line-height:1.25;border-radius:8px 8px 0 0;gap:3px;word-break:break-word}
 .stair small{font-size:8.5px;padding:1px 4px}
 .stair em{font-size:9px}
 .card>.row:last-child,.card>div[style*="text-align:center"]>.btn.g{margin-bottom:0}
 .podium{margin:56px 0 22px;gap:6px}
 .pc{width:32%;border-radius:18px;padding:0 5px 10px}
 .pn{font-size:13.5px}.p1 .pn{font-size:15px}.pp{font-size:18px}
 .wh-st{font-size:16px}
}
/* ===== الجوالات الصغيرة (360 وأقل) ===== */
@media(max-width:360px){
 header h1{font-size:27px}
 .tabs>button,.tabs:has(>.chip:nth-child(5))>button{white-space:normal;line-height:1.3;font-size:11.5px;padding:8px 4px}
 .stairs{gap:2px}.stair{font-size:8px;word-break:normal;overflow-wrap:normal;padding:5px 0}.stair small{font-size:7px;padding:1px 2px;white-space:nowrap;letter-spacing:-.2px}.stair em{font-size:7.5px}
 .stat b{font-size:20px}
}
.tg{position:absolute;top:12px;left:12px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer}
html[data-student] .modes{display:none}header p:empty{display:none}

  const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
  const [A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);

 for(let y0=0;y0<H;y0+=BU){const hu=Math.min(BU+over,H-y0);cv.height=Math.round(hu*sc);const x=cv.getContext('2d');
  x.setTransform(sc,0,0,sc,0,-y0*sc);drawCard(x,C.cards[i],sc);yield {cv,y0,hu,rows:Math.round(Math.min(BU,H-y0)*sc)}}
 cv.width=cv.height=0}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function chunk(type,data){const out=new Uint8Array(12+data.length),dv=new DataView(out.buffer);dv.setUint32(0,data.length);
 for(let k=0;k<4;k++)out[4+k]=type.charCodeAt(k);out.set(data,8);let c=0xFFFFFFFF;for(let k=4;k<8+data.length;k++)c=CRC[(c^out[k])&255]^(c>>>8);
 dv.setUint32(8+data.length,(c^0xFFFFFFFF)>>>0);return out}
async function tiledGen(w,h,rowsPer,paintFn){await needPako();const parts=[];let sink,done;
 if(window.CompressionStream){const cs=new CompressionStream('deflate'),wr=cs.writable.getWriter(),rd=cs.readable.getReader();
  done=(async()=>{for(;;){const r=await rd.read();if(r.done)break;parts.push(r.value)}})();
  sink={write:b=>wr.write(b),close:()=>wr.close()}}
 else if(window.pako){const df=new pako.Deflate({level:6});df.onData=c=>parts.push(c);
  sink={write:async b=>{df.push(b,false)},close:async()=>{df.push(new Uint8Array(0),true)}};done=Promise.resolve()}
 else throw new Error('no deflate');
 hold=true;const cv=document.createElement('canvas');cv.width=w;
 try{for(let y0=0;y0<h;y0+=rowsPer){const rows=Math.min(rowsPer,h-y0);cv.height=rows;const x=cv.getContext('2d');paintFn(x,y0,rows);
   x.setTransform(1,0,0,1,0,0);const d=x.getImageData(0,0,w,rows).data;
   if(d[3]!==255)throw new Error('strip');
   const ln=1+w*3,out=new Uint8Array(rows*ln);let o=0,p=0;
   for(let r=0;r<rows;r++){out[o++]=1;let pr=0,pg=0,pb=0;
    for(let c=0;c<w;c++){const R=d[p],G=d[p+1],B=d[p+2];p+=4;out[o++]=(R-pr)&255;out[o++]=(G-pg)&255;out[o++]=(B-pb)&255;pr=R;pg=G;pb=B}}
   await sink.write(out);await new Promise(r=>setTimeout(r,0))}
  await sink.close();await done}
 finally{cv.width=cv.height=0;dropExportLayers()}
 let n=0;parts.forEach(c=>n+=c.length);const idat=new Uint8Array(n);let q=0;parts.forEach(c=>{idat.set(c,q);q+=c.length});
 const ih=new Uint8Array(13),dv=new DataView(ih.buffer);dv.setUint32(0,w);dv.setUint32(4,h);ih[8]=8;ih[9]=2;
 return new Blob([new Uint8Array([137,80,78,71,13,10,26,10]),chunk('IHDR',ih),chunk('IDAT',idat),chunk('IEND',new Uint8Array(0))],{type:'image/png'})}
const tiledPNG=(i,sc)=>tiledGen(W*sc,H*sc,53*sc,(x,y0)=>{x.setTransform(sc,0,0,sc,0,-y0);drawCard(x,C.cards[i],sc)});
const A4={cw:52.27,ch:52.27*H/W};
A4.pos=j=>{const m=C.a4m||0,gx=(210-2*m-3*A4.cw)/2,py=A4.ch+(297-2*m-3*A4.ch)/2;return {x:m+(j%3)*(A4.cw+gx),y:m+Math.floor(j/3)*py}};
function sheetPNG(start,dpi){const mm=(dpi||100*EX)/25.4,w=Math.round(210*mm),h=Math.round(297*mm),k=A4.cw*mm/W;
 return tiledGen(w,h,Math.max(64,Math.floor(2.6e6/w)),(x,y0,rows)=>{x.fillStyle='#ffffff';x.fillRect(0,0,w,rows);
  for(let j=0;j<9&&start+j<C.cards.length;j++){const p=A4.pos(j),py=Math.round(p.y*mm),px=Math.round(p.x*mm);
   if(py>y0+rows||py+H*k<y0)continue;x.setTransform(k,0,0,k,px,py-y0);drawCard(x,C.cards[start+j],k)}})}
async function cardPNG(i,sc){
 if(!tooBig(sc)){const cv=direct(i,sc);if(cv){const b=await blob(cv);cv.width=cv.height=0;return b}}
 try{return await tiledPNG(i,sc)}catch(e){console.error(e)}
 return blob(safeRender(i,sc))}
function cardToPdf(p,i,sc,x,y,wu,q){const k=wu/W;
 if(!tooBig(sc)){const cv=direct(i,sc);if(cv){p.addImage(jpg(cv,q),'JPEG',x,y,wu,H*k,undefined,'FAST');cv.width=cv.height=0;return}}
 hold=true;
 try{for(const st of strips(i,sc,106,1))p.addImage(jpg(st.cv,q),'JPEG',x,y+st.y0*k,wu,st.hu*k,undefined,'FAST')}
 finally{dropExportLayers()}}
function safeRender(i,want){for(const sc of [8,6,5,4,3,2]){if(sc>want||sc>okScale)continue;
  const cv=direct(i,sc);
  if(cv){if(sc<want&&okScale>sc)toast('تعذر التصدير بالدقة المختارة على هذا الجهاز، تم التصدير بدقة '+W*sc+'×'+H*sc);okScale=sc;return cv}}
 throw new Error('canvas')}

async function buildPdf(list,sc,q,btn){await needPdf();const p=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});let first=true;
 for(let n=0;n<list.length;n++){NM=list[n];if(btn)btn.textContent='جارٍ التجهيز… '+(n+1)+'/'+list.length;
