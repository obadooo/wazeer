function offD(c){return (S.set.off&&S.set.off[c])||(c==='القرآنية'?[1,7]:[])}
function toggleOffD(c,d){
 S.set.off=S.set.off||{};
 const cur=[...offD(c)];
 const idx=cur.indexOf(d);
 if(idx>=0)cur.splice(idx,1);else cur.push(d);
 S.set.off[c]=cur.sort((a,b)=>a-b);
 save();render();
}
function dcnt(c,n){let t=0;for(let d=1;d<=7;d++)if(!offD(c).includes(d)&&(d-1)%(n||1)===0)t++;return t}
function hasRec(mid,c,w,d){
 const items=S.items.filter(i=>i.cat===c);
 return items.some(it=>S.sc[key(w,it.f==='d'?d:0,mid,it.id)]!==undefined)||S.sc[key(w,0,mid,'fin:'+c)]!==undefined;
}
function stepMem(dir){

 mem=S.members[next].id;render();
}

 S.items.filter(i=>i.cat===cat&&i.f==='d'&&(day-1)%(i.n||1)===0).forEach(it=>{

function ask(msg,fn,yes){const d=document.createElement('div');d.className='ovl';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';d.innerHTML='<div class="card" style="max-width:320px;text-align:center;margin:0"><p style="font-weight:700">'+msg+'</p><div class="row" style="justify-content:center"><button class="btn x" id="ay">'+(yes||'نعم، حذف')+'</button><button class="btn g" id="an">إلغاء</button></div></div>';document.body.appendChild(d);d.querySelector('#an').onclick=()=>d.remove();d.querySelector('#ay').onclick=()=>{d.remove();fn()}}
function toast(m){const d=document.createElement('div');d.className='ovl';d.textContent=m;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#143533;color:#fff;padding:10px 18px;border-radius:99px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2)';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function setS(k,v){S.set[k]=v;save();render()}
function addIn(){const t=$('it').value.trim();if(!t)return;S.inits.push({id:'n'+Date.now(),week:+$('iw').value,text:t,pts:+$('ipt').value||0,c:+$('icn').value||0});save();render()}
setTheme(document.documentElement.dataset.theme||'light');
render();

/* ====== المزامنة السحابية (Firebase Firestore) ====== */
function cloudPush(){
 if(!_cl||STU)return;
 setSyncUI('wait');
 clearTimeout(_t);
 _t=setTimeout(()=>{
  _cl.set(_cl.ref,{json:JSON.stringify(S),ts:S.ts||0})
   .then(()=>setSyncUI('ok'))
   .catch(()=>{setSyncUI('err');toast('تعذّرت المزامنة')});
 },400);
}
function applyRemote(d){
 S=d;ens();S.set=Object.assign({harvest:false,council:false,hn:3,cn:5,showNames:false},S.set||{});
 if(!S.members.some(m=>m.id===mem))mem=S.members[0]&&S.members[0].id;
 try{localStorage.setItem('wz2',JSON.stringify(S))}catch(e){}
 setSyncUI('ok');
 const go=()=>{const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))setTimeout(go,1500);else render()};go();
}
async function cloudInit(){
 if(FB_CONFIG.apiKey.startsWith('PASTE'))return;
 try{
  setSyncUI('wait','جاري الاتصال... ⏳');
  const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
  const [A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js')]);
  const ap=A.initializeApp(FB_CONFIG);const db=DB_ID?F.getFirestore(ap,DB_ID):F.getFirestore(ap);
  const ref=F.doc(db,'wazeer','state');
  _cl={ref,set:F.setDoc};setSyncUI('ok');
  setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()},0);
  F.onSnapshot(ref,snap=>{
   if(!snap.exists()){cloudPush();return}
   let d;try{d=JSON.parse(snap.data().json)}catch(e){return}
   if(d&&d.items&&(d.ts||0)>(S.ts||0))applyRemote(d);
   else if((S.ts||0)>(d.ts||0))cloudPush();
   else setSyncUI('ok');
  },()=>{setSyncUI('err');toast('تعذّر الاتصال بالسحابة')});
 }catch(e){setSyncUI('local');toast('تعذّر تحميل المزامنة')}
}
cloudInit();
</script>
